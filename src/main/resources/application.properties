spring.application.name=carsharing1

# HTTP: Railway sets PORT; optional SERVER_PORT / APP_PORT for other hosts
server.port=${PORT:${SERVER_PORT:${APP_PORT:8080}}}

# PostgreSQL: RailwayJdbcUrlEnvironmentPostProcessor maps DATABASE_URL (postgresql://... with user/pass inside).
# Without DATABASE_URL: JDBC URL from SPRING_DATASOURCE_URL or PGHOST/PGPORT/POSTGRES_DB|PGDATABASE.
# Password: Railway often exposes PGPASSWORD (not DB_PASSWORD); username: PGUSER or POSTGRES_USER.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${POSTGRES_DB:${PGDATABASE:carsharing}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Comma-separated origins for browser clients (e.g. Railway frontend / Vercel). Empty = no extra CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.example.carsharing1.controller
springdoc.paths-to-match=/api/**

# Actuator (health for Docker / PaaS / CI)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# AOP
spring.aop.auto=true
spring.aop.proxy-target-class=true
