spring.application.name=carsharing1

# HTTP: Railway uses PORT; docker-compose .env.example uses APP_PORT
server.port=${PORT:${APP_PORT:8080}}

# PostgreSQL: DATABASE_URL (linked Postgres on Railway) beats everything. Then PG* / docker-compose names; host has no POSTGRES_* default on PaaS — link DB or set PGHOST.
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/carsharing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ?????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ???????????
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.example.carsharing1.controller
springdoc.paths-to-match=/api/**

# Actuator (health for Docker / PaaS / CI)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# AOP
spring.aop.auto=true
spring.aop.proxy-target-class=true
