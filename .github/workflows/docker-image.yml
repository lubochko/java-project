name: Docker Image CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # Уникальная группа по имени файла workflow (не только github.workflow из YAML name:).
  group: docker-image-yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carsharing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carsharing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/carsharing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (Maven package, без тестов)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package -DskipTests -Pcheckstyle-skip,ci

      - name: Tests (Maven test)
        run: ./mvnw -B -ntp test -Pcheckstyle-skip,ci

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag carsharing:${{ github.sha }} --tag carsharing:latest

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (Railway CLI или deploy hook)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          set -e
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_SERVICE" ]; then
            npm i -g @railway/cli
            railway up --ci --service "$RAILWAY_SERVICE"
            exit 0
          fi
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
            exit 0
          fi
          echo "Deploy пропущен: задайте secrets RAILWAY_TOKEN + RAILWAY_SERVICE или DEPLOY_HOOK_URL."
          exit 0

      - name: Healthcheck (production)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "Healthcheck пропущен: задайте secret APP_BASE_URL (корень сайта, без / в конце)."
            exit 0
          fi
          for i in $(seq 1 36); do
            if curl -fsS "$APP_BASE_URL/actuator/health" | grep -q UP; then
              echo "Health OK"
              exit 0
            fi
            echo "Ожидание… ($i/36)"
            sleep 10
          done
          echo "Healthcheck не прошёл за ~6 минут"
          exit 1
